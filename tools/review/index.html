<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src http: https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline' file: 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>トレマネ 正誤チェック（開発専用）</title>
<style>
:root { --bg:#fff; --fg:#111; --mut:#666; --line:#ddd; --card:#fafafa; --acc:#e8590c; --ok:#2b8a3e; --bad:#c92a2a; --warn:#b26a00; }
@media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mut:#999; --line:#333; --card:#1a1a1a; --acc:#ff922b; --ok:#69db7c; --bad:#ff8787; --warn:#ffc078; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 system-ui,"Hiragino Sans","Yu Gothic",sans-serif; }
header.top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 12px; }
@media (max-width: 700px) { header.top { position:static; } }
header.top .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
h1 { font-size:15px; margin:0 8px 0 0; }
h2 { font-size:15px; margin:0 0 8px; } h3 { font-size:13px; margin:14px 0 4px; color:var(--mut); }
button, select, input, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
button { cursor:pointer; } button:disabled { opacity:.4; cursor:default; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
label.file { display:inline-block; border:1px solid var(--line); border-radius:6px; padding:5px 8px; cursor:pointer; }
label.file input { display:none; }
#stats { font-size:12px; color:var(--mut); } #saveState { font-size:11px; color:var(--mut); }
main, #welcome, #empty { padding:12px; max-width:1500px; margin:0 auto; }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width: 860px) { .cols { grid-template-columns:1fr; } }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
table.kv { width:100%; border-collapse:collapse; } table.kv th { text-align:left; width:6.5em; color:var(--mut); font-weight:normal; vertical-align:top; padding:2px 8px 2px 0; white-space:nowrap; }
table.kv td { word-break:break-all; overflow-wrap:anywhere; padding:2px 0; } table.dup { border-top:1px dashed var(--line); margin-top:8px; }
.none, .missing { color:var(--mut); } .missing { background:rgba(255,160,0,.12); border:1px dashed var(--warn); border-radius:6px; padding:6px 8px; }
.note { color:var(--mut); font-size:12px; margin:4px 0; }
pre.body { white-space:pre-wrap; word-break:break-all; overflow-wrap:anywhere; max-height:380px; overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; font:12.5px/1.6 inherit; margin:0; }
.imgwrap img { max-width:100%; height:auto; border:1px solid var(--line); border-radius:6px; margin:4px 0; }
a { color:var(--acc); word-break:break-all; }
.badge { display:inline-block; padding:3px 10px; border-radius:999px; border:1px solid var(--line); font-weight:600; }
.b-auto_registered { border-color:var(--ok); color:var(--ok); } .b-excluded { border-color:var(--bad); color:var(--bad); } .b-pending { border-color:var(--warn); color:var(--warn); } .b-duplicate { border-color:var(--acc); color:var(--acc); }
.verdicts { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; } @media (max-width: 700px) { .verdicts { grid-template-columns:1fr 1fr; } }
.vbtn { text-align:left; padding:8px; } .vbtn small { display:block; color:var(--mut); font-size:11px; font-weight:normal; line-height:1.3; }
.vbtn.on { border-width:2px; font-weight:600; } .vbtn.on.v-correct { border-color:var(--ok); } .vbtn.on.v-partial { border-color:var(--warn); } .vbtn.on.v-wrong { border-color:var(--bad); } .vbtn.on.v-unknown { border-color:var(--mut); }
.fields { margin-top:10px; display:grid; gap:6px; } .frow { display:grid; grid-template-columns:12em 12em 1fr; gap:6px; align-items:center; }
@media (max-width: 700px) { .frow { grid-template-columns:1fr 1fr; } .frow .fval { grid-column:1 / -1; } }
.fval input, .fval select { width:100%; } textarea { width:100%; }
.issue { color:var(--bad); margin:4px 0; } .okmsg { color:var(--ok); margin:4px 0; font-size:12px; }
.nav { display:flex; gap:8px; align-items:center; margin:0 0 10px; flex-wrap:wrap; } #caseTitle { font-weight:600; word-break:break-all; }
.toast { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:#222; color:#fff; padding:8px 14px; border-radius:8px; max-width:92vw; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9; }
.toast.show { opacity:1; } .toast.bad { background:var(--bad); }
.warnbox { border:1px solid var(--warn); border-radius:8px; padding:8px 10px; font-size:12px; margin:8px 0; }
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <h1>正誤チェック（開発専用）</h1>
    <label class="file">事例集を開く<input id="fileSet" type="file" accept=".json,application/json"></label>
    <span id="stats"></span><span id="saveState"></span>
  </div>
  <div id="app" hidden>
    <div class="row" style="margin-top:6px">
      <label><input id="fUnev" type="checkbox"> 未評価だけ</label>
      <select id="fVerdict" aria-label="評価で絞り込み"></select>
      <select id="fCategory" aria-label="区分で絞り込み"></select>
      <button id="prev" type="button">← 前へ</button><span id="pos"></span><button id="next" type="button">次へ →</button>
      <label class="file">評価結果を読み込む<input id="fileAns" type="file" accept=".json,application/json"></label>
      <button id="export" type="button" class="primary">評価結果を書き出す（JSON）</button>
    </div>
  </div>
</header>
<section id="welcome">
  <div class="card">
    <h2>使い方</h2>
    <ol>
      <li>上の「事例集を開く」で、書き出した事例集（review-set-….json）を選びます。</li>
      <li>左の元の告知と、右のAIの判断を見比べ、下の4つから評価を選びます。誤りがあれば項目を「誤り」にして正しい値を入力します。</li>
      <li>入力はこのブラウザに自動保存されます。<b>正式なバックアップは「評価結果を書き出す」のJSONです。</b>区切りごとに書き出してください。</li>
    </ol>
    <p class="note">このツールは通信しません（外部への送信は遮断しています）。元の告知のリンクと画像だけがブラウザから直接開かれます。</p>
    <label class="file">事例集を開く<input id="fileSet2" type="file" accept=".json,application/json"></label>
  </div>
</section>
<main id="main" hidden>
  <div class="nav"><span id="caseTitle"></span></div>
  <div class="cols">
    <div class="card" id="source"></div>
    <div class="card" id="ai"></div>
  </div>
  <div class="card" id="eval" style="margin-top:12px"></div>
</main>
<div id="empty" hidden><div class="card">条件に合う事例がありません。絞り込みを変えてください。</div></div>
<div id="toast" class="toast" role="status"></div>
<script src="review-core.js"></script>
<script src="review-app.js"></script>
</body>
</html>
